<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{report_title}}</title>
<style>
:root{--ink:#132238;--muted:#607188;--blue:#145ab8;--cyan:#0a89a8;--green:#177653;--red:#af3730;--amber:#986000;--line:#c5d2df;--soft:#f3f7fb;--paper:#fff;--bg:#eaf1f7}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei UI","Noto Sans SC",Arial,sans-serif}body{margin:0}.shell{width:min(1200px,calc(100% - 32px));margin:24px auto 60px}.mast{background:#102946;color:#fff;padding:34px 38px 30px;border-top:6px solid #38bdf8;display:flex;justify-content:space-between;gap:28px}.kicker,.item-id,.field h4,.attachment h4,.status-label,.counter-title{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}.kicker{font-size:11px;color:#7dd3fc;font-weight:700}.mast h1{font-size:clamp(32px,5vw,56px);line-height:1.06;letter-spacing:-.04em;margin:10px 0 12px}.mast p{margin:0;color:#c6d5e6;font-size:13px;line-height:1.75}.summary{align-self:end;display:flex;gap:8px}.summary div{min-width:92px;border:1px solid #ffffff3e;padding:11px}.summary b{display:block;font:700 21px/1 ui-monospace,Consolas,monospace}.summary span{font-size:11px;color:#c6d5e6}.section{margin-top:20px;background:var(--paper);border:1px solid var(--line)}.section-head{display:flex;align-items:center;gap:12px;padding:18px 23px;border-bottom:1px solid var(--line)}.section-head b{background:var(--blue);color:#fff;font:700 11px/1 ui-monospace,Consolas,monospace;padding:7px 8px}.section-head h2{margin:0;font-size:20px}.section-head span{margin-left:auto;color:var(--muted);font:700 10px/1 ui-monospace,Consolas,monospace}.lead{padding:22px 26px;border-bottom:1px solid var(--line);background:#fbfdff}.lead:last-child{border-bottom:0}.lead h3{font-size:17px;margin:0 0 10px}.lead p{margin:0;max-width:78ch;font-size:14px;line-height:1.85;color:#28445e}.daily-item{display:grid;grid-template-columns:minmax(0,1fr) 260px;border-bottom:1px solid var(--line)}.daily-item:last-child{border-bottom:0}.narrative{padding:24px 26px 26px}.item-title{display:flex;align-items:start;gap:10px;margin-bottom:20px}.item-id{color:var(--blue);font-size:10px;font-weight:700;padding-top:5px;white-space:nowrap}.item-title h3{margin:0;flex:1;font-size:18px;line-height:1.55}.badge{font:700 11px/1 ui-monospace,Consolas,monospace;padding:6px 8px;background:#eaf7ef;color:var(--green);white-space:nowrap}.badge.warn{background:#fff4dc;color:var(--amber)}.badge.fail{background:#fdeeed;color:var(--red)}.field{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid #dbe4ec}.field:last-child{padding:0;margin:0;border:0}.field h4{margin:0 0 8px;color:var(--blue);font-size:11px}.field h4:before{content:"— ";color:var(--cyan)}.field p{margin:0;max-width:74ch;font-size:14px;line-height:1.9;overflow-wrap:anywhere}.field.result p{font-weight:600;color:#193654}.attachment{border-left:1px solid var(--line);background:var(--soft);padding:24px 18px}.attachment h4{margin:0 0 14px;font-size:11px;color:var(--muted)}.attachment h4:before{content:"附件 / ";color:var(--blue)}.file{display:block;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.55;text-decoration:none;padding:11px 12px;margin-bottom:9px;overflow-wrap:anywhere}.file:before{content:"LINK";font:700 9px/1 ui-monospace,Consolas,monospace;color:var(--blue);margin-right:7px}.empty{font-size:13px;color:var(--muted);margin:0}.attachment-note{margin:14px 0 0;font-size:11px;line-height:1.65;color:var(--muted)}.counter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}.counter{padding:18px 20px;border-right:1px solid var(--line)}.counter:last-child{border-right:0}.counter-title{display:block;font-size:10px;color:var(--muted)}.counter b{display:block;font-size:24px;line-height:1.1;margin:8px 0 5px}.counter p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.plan{padding:20px 26px}.plan-row{display:grid;grid-template-columns:50px minmax(0,1fr) 110px;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.plan-row:last-child{border-bottom:0}.plan-no{font:700 15px/1 ui-monospace,Consolas,monospace;color:var(--blue)}.plan-row h3{font-size:16px;margin:0 0 6px}.plan-row p{font-size:13px;line-height:1.7;margin:0;color:#29455f}.plan-row time{font:700 11px/1.6 ui-monospace,Consolas,monospace;color:var(--muted)}.footer{font-size:11px;color:var(--muted);padding:18px 0}.file:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
@media(max-width:760px){.shell{width:100%;margin:0}.mast{display:block;padding:28px 20px}.summary{margin-top:20px}.summary div{min-width:0;flex:1}.summary b{font-size:15px;overflow-wrap:anywhere}.section{border-left:0;border-right:0}.section-head{padding:17px 20px}.section-head span{display:none}.lead{padding:20px}.daily-item{grid-template-columns:1fr}.narrative{padding:22px 20px}.attachment{border-left:0;border-top:1px solid var(--line);padding:18px 20px}.item-title{flex-wrap:wrap}.item-title h3{flex-basis:100%;order:3}.counter-grid{grid-template-columns:1fr}.counter{border-right:0;border-bottom:1px solid var(--line)}.counter:last-child{border-bottom:0}.plan{padding:6px 20px}.plan-row{grid-template-columns:42px 1fr}.plan-row time{grid-column:2}.field p,.lead p{font-size:15px;line-height:1.85}}
@media print{html{background:#fff}.shell{width:100%;margin:0}.mast{print-color-adjust:exact}.daily-item,.lead,.plan-row{break-inside:avoid}}
 .commitment-list{background:#fbfdff}.commitment-row{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;padding:20px 26px;border-bottom:1px solid var(--line)}.commitment-row:last-child{border-bottom:0}.commitment-row h3{margin:6px 0;font-size:16px}.commitment-row p{margin:0;color:#28445e;font-size:13px;line-height:1.75}.commitment-check{border-left:1px solid var(--line);padding-left:18px}.commitment-check b{display:block;color:var(--blue);font-size:17px}.commitment-check span{display:block;color:var(--muted);font-size:11px;margin:2px 0 7px}.commitment-check p{font-size:12px}.progress-meta{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:start;margin:0 0 18px;padding:12px 14px;background:#f0f6fc;border-left:3px solid var(--cyan)}.progress-meta b{display:block;color:var(--blue);font-size:16px}.progress-meta span{display:block;color:var(--muted);font-size:11px}.progress-meta p{margin:0;color:#28445e;font-size:13px;line-height:1.75}

/* project-v1: shared shell for the deterministic renderer. */
.shell>h1{background:#102946;color:#fff;border-top:6px solid #38bdf8;padding:28px 30px;margin:0;font-size:32px;line-height:1.4}
.shell>p{padding:0 30px;margin:10px 0;color:var(--muted);font-size:13px;line-height:1.7}
.section{padding:0 26px 22px}.section>h2{margin:0 -26px 18px;padding:18px 26px;border-bottom:1px solid var(--line);font-size:21px;color:var(--blue)}
h3{font-size:19px;margin:22px 0 10px}h4{font-size:17px;margin:0 0 12px}p{font-size:14px;line-height:1.8;overflow-wrap:anywhere}strong{color:#28445e}a{color:var(--blue);overflow-wrap:anywhere}
.commitment-row{display:block;padding:14px 18px;background:#f3f7fb;margin:8px 0;border:1px solid #dbe4ec}.commitment-row h4{font-size:15px;margin:0 0 6px}.commitment-row p{margin:2px 0}
.project{margin-bottom:20px}.project:last-child{margin-bottom:0}.project>h3{border-left:4px solid var(--cyan);padding-left:12px}.project>p{color:#46627e}
.daily-item{border:1px solid var(--line);margin:12px 0}.narrative{padding:20px}.narrative p{margin:7px 0}.attachment{padding:20px 16px}.attachment p{font-size:12px}.attachment>p:first-child{font-weight:bold;color:var(--muted)}
@media(max-width:760px){.section{padding:0 18px 18px}.section>h2{margin:0 -18px 15px;padding:16px 18px}.shell>h1{font-size:25px;padding:22px 18px}.shell>p{padding:0 18px}.commitment-row{display:block;padding:12px}.narrative{padding:16px}.daily-item{grid-template-columns:1fr}}
@media print{.shell>h1{print-color-adjust:exact}.section{border-color:#bbb}.section>h2,h3,h4{break-after:avoid}.daily-item{break-inside:auto}.commitment-row{break-inside:avoid}}
</style>
</head>
<body>
<main class="shell">
{{report_content}}
</main>
</body>
</html>
